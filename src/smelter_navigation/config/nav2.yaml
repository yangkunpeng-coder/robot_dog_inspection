map_server:
  ros__parameters:
    use_sim_time: true

amcl:
  ros__parameters:
    use_sim_time: true
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    scan_topic: /scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    laser_model_type: likelihood_field
    laser_min_range: 0.09
    laser_max_range: 10.0
    max_beams: 80
    min_particles: 400
    max_particles: 1800
    update_min_d: 0.08
    update_min_a: 0.08
    transform_tolerance: 0.5
    tf_broadcast: true
    set_initial_pose: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.10
      allow_unknown: false
      use_astar: true
      use_final_approach_orientation: false

controller_server:
  ros__parameters:
    use_sim_time: true
    odom_topic: /odom
    controller_frequency: 15.0
    failure_tolerance: 1.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker, dock_goal_checker]
    controller_plugins: [FollowPath, Dock]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.10
      movement_time_allowance: 12.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.08
      stateful: true
    dock_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.055
      yaw_goal_tolerance: 0.08
      stateful: true
    FollowPath: &dwb
      plugin: dwb_core::DWBLocalPlanner
      min_vel_x: 0.0
      max_vel_x: 0.33
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.75
      min_speed_xy: 0.0
      max_speed_xy: 0.33
      min_speed_theta: 0.0
      acc_lim_x: 0.6
      acc_lim_y: 0.0
      acc_lim_theta: 1.6
      decel_lim_x: -0.8
      decel_lim_y: 0.0
      decel_lim_theta: -1.6
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 23
      sim_time: 1.5
      linear_granularity: 0.045
      angular_granularity: 0.045
      transform_tolerance: 0.35
      xy_goal_tolerance: 0.10
      trans_stopped_velocity: 0.035
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: [RotateToGoal, Oscillation, ObstacleFootprint, BaseObstacle, PathAlign, GoalAlign, PathDist, GoalDist]
      RotateToGoal.scale: 30.0
      RotateToGoal.slowing_factor: 5.0
      ObstacleFootprint.scale: 0.02
      BaseObstacle.scale: 0.02
      PathAlign.scale: 28.0
      PathAlign.forward_point_distance: 0.15
      GoalAlign.scale: 18.0
      GoalAlign.forward_point_distance: 0.15
      PathDist.scale: 28.0
      GoalDist.scale: 22.0
    Dock:
      <<: *dwb
      max_vel_x: 0.075
      max_speed_xy: 0.075
      max_vel_theta: 0.45
      acc_lim_x: 0.30
      xy_goal_tolerance: 0.055
      trans_stopped_velocity: 0.023
      vx_samples: 12
      linear_granularity: 0.025

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 20
    default_server_timeout: 40
    wait_for_service_timeout: 3000
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_rate_controller_bt_node

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 0.5
      update_frequency: 4.0
      publish_frequency: 1.0
      resolution: 0.1
      track_unknown_space: true
      footprint_padding: 0.025
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        subscribe_to_updates: false
      obstacle_layer: &obstacles
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: false
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: true
          obstacle_max_range: 7.5
          raytrace_max_range: 9.5
          max_obstacle_height: 2.0
      inflation_layer: &inflation
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.64
        cost_scaling_factor: 3.8
        inflate_around_unknown: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      transform_tolerance: 0.45
      update_frequency: 10.0
      publish_frequency: 4.0
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      footprint_padding: 0.025
      plugins: [obstacle_layer, inflation_layer]
      obstacle_layer:
        <<: *obstacles
        enabled: true
      inflation_layer: *inflation

collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_nav
    cmd_vel_out_topic: /cmd_vel
    source_timeout: 0.35
    stop_pub_timeout: 2.0
    transform_tolerance: 0.25
    base_shift_correction: true
    polygons: [Stop, Slow]
    Stop:
      type: polygon
      action_type: stop
      max_points: 3
      visualize: true
      polygon_pub_topic: /safety/stop_zone
    Slow:
      type: polygon
      action_type: slowdown
      slowdown_ratio: 0.55
      max_points: 3
      visualize: true
      polygon_pub_topic: /safety/slow_zone
    observation_sources: [scan]
    scan:
      type: scan
      topic: /scan
